services:
    postgres:
        image: postgres:18
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER - copy .env.example to .env and fill in the value}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD - copy .env.example to .env and fill in the value}
            POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB - copy .env.example to .env and fill in the value}
        volumes:
            - "pgdata:/var/lib/postgresql"
volumes:
    pgdata: